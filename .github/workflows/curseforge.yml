# Endless Map: a published GitHub Release's zips go to CurseForge (project 1725335) - .github/scripts/curseforge.py.
# By hand (Actions > CurseForge > Run workflow) with a tag and "upload" unticked: the smoke test - everything is
# checked and prepared, nothing is sent.
name: CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v1.6.0"
        required: true
      upload:
        description: "Really upload to CurseForge (unticked: smoke test, nothing is sent)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  curseforge:
    if: github.repository == 'rhadlock/EndlessMap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The release's zips to CurseForge
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          UPLOAD: ${{ github.event_name == 'release' || inputs.upload }}
          PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease }}
        run: python3 .github/scripts/curseforge.py
